<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>

    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    var map = L.map('map').setView([36.8065, 10.1815], 13);


    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var busMarker = L.marker([36.8065, 10.1815]).addTo(map);

    function updateBusPosition(lat, lng) {
        busMarker.setLatLng([lat, lng]);
    }

    function panToBus(lat, lng) {
        map.panTo([lat, lng]);
    }

    function fixMapSize() {
        // force recalcul 3 fois (WebView resize glitch)
        setTimeout(() => map.invalidateSize(true), 100);
        setTimeout(() => map.invalidateSize(true), 400);
        setTimeout(() => map.invalidateSize(true), 900);
    }
</script>
</body>
</html>
