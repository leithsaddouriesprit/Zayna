<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tracking</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>

    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    // 1) MAP INIT
    var map = L.map('map').setView([36.8065, 10.1815], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2) BUS MARKER
    var busMarker = L.marker([36.8065, 10.1815], { title: "Bus" }).addTo(map);

    function updateBusPosition(lat, lng) { busMarker.setLatLng([lat, lng]); }
    function panToBus(lat, lng) { map.panTo([lat, lng]); }

    function fixMapSize() {
        setTimeout(() => map.invalidateSize(true), 100);
        setTimeout(() => map.invalidateSize(true), 400);
        setTimeout(() => map.invalidateSize(true), 900);
    }

    // 3) ROUTE (REAL ROADS via OSRM)
    var routeLayer = null;
    var stopMarkers = [];

    // stops = [{lat:36.8,lng:10.18,name:"...",order:0}, ...]
    async function setRoute(stops) {
        if (!stops || stops.length < 2) return;

        // clear old layers
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        stopMarkers.forEach(m => map.removeLayer(m));
        stopMarkers = [];

        // sort by order
        stops.sort((a,b) => (a.order ?? 0) - (b.order ?? 0));

        // markers
        stops.forEach(s => {
            var p = [s.lat, s.lng];
            var m = L.circleMarker(p, { radius: 6, weight: 2 }).addTo(map);
            m.bindPopup("<b>" + (s.name || "Arrêt") + "</b><br>Ordre: " + (s.order ?? "-"));
            stopMarkers.push(m);
        });

        // build OSRM coords: lng,lat;lng,lat;...
        var coords = stops.map(s => `${s.lng},${s.lat}`).join(";");

        // OSRM public demo (OK for dev/tests; for production use your own OSRM)
        var url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (!data.routes || data.routes.length === 0) {
                console.error("OSRM: no route", data);
                return;
            }

            var geo = data.routes[0].geometry; // GeoJSON LineString
            routeLayer = L.geoJSON(geo, { }).addTo(map);

            map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

        } catch (e) {
            console.error("OSRM fetch error:", e);
        }
    }
</script>
</body>
</html>
