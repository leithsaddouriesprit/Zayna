<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tracking</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>

    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    // 1) Map init
    const map = L.map('map').setView([36.8065, 10.1815], 13);

    // 2) Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3) BUS marker (très visible)
    const busIcon = L.divIcon({
        className: "",
        html: "<div style='font-size:28px; transform: translate(-50%,-50%);'>🚌</div>",
        iconSize: [28, 28]
    });

    let busMarker = L.marker([36.8065, 10.1815], { icon: busIcon })
        .addTo(map)
        .bindPopup("BUS");

    // 4) Stops + route (placeholders)
    let stopsLayer = L.layerGroup().addTo(map);
    let routeLine = null;

    // ====== API JS appelée depuis JavaFX (engine.executeScript) ======

    // Update bus marker position
    function updateBusPosition(lat, lng) {
        busMarker.setLatLng([lat, lng]);
    }

    // Pan to bus
    function panToBus(lat, lng) {
        map.panTo([lat, lng]);
    }

    // Draw stops (array: [{name, lat, lng, order}])
    function setStops(stops) {
        stopsLayer.clearLayers();

        const latlngs = [];

        stops.forEach(s => {
            latlngs.push([s.lat, s.lng]);

            L.circleMarker([s.lat, s.lng], {
                radius: 6,
                color: "#1f2937",
                fillColor: "#3b82f6",
                fillOpacity: 1
            })
                .addTo(stopsLayer)
                .bindPopup((s.order ? ("#" + s.order + " - ") : "") + (s.name || "Stop"));
        });

        // Auto draw route if we have 2+ points
        if (latlngs.length >= 2) {
            drawRoute(latlngs);
        }
    }

    // Draw route polyline
    function drawRoute(latlngs) {
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(latlngs, { weight: 5 }).addTo(map);
    }

    // Force size recalculation (WebView resize glitch)
    function fixMapSize() {
        setTimeout(() => map.invalidateSize(true), 100);
        setTimeout(() => map.invalidateSize(true), 400);
        setTimeout(() => map.invalidateSize(true), 900);
    }

    // ====== TEST local (tu peux supprimer après) ======
    // Exemple: stops dummy
    // setStops([

    //   { order: 2, name: "Stop 2", lat: 36.8100, lng: 10.1700 },
    //   { order: 3, name: "École", lat: 36.8200, lng: 10.1900 }
    // ]);
</script>
</body>
</html>
