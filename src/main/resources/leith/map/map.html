<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tracking</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>


    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    // 1) MAP INIT
    var map = L.map('map').setView([36.8065, 10.1815], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    function initBus(lat, lng, zoom) {
        busMarker.setLatLng([lat, lng]);
        map.setView([lat, lng], zoom || 14);
    }

    // 2) BUS ICON
    var busIcon = L.icon({
        iconUrl: 'bus.png',
        iconSize: [40, 40],
        iconAnchor: [20, 20],
        popupAnchor: [0, -20]
    });

    // 3) BUS MARKER
    var busMarker = L.marker([36.8065, 10.1815], {
        icon: busIcon,
        title: "Bus"
    }).addTo(map);


    function updateBusPosition(lat, lng, angle) {
        busMarker.setLatLng([lat, lng]);

        if (angle !== undefined) {
            busMarker.setRotationAngle(angle);
        }
    }

    function panToBus(lat, lng) { map.panTo([lat, lng]); }

    function fixMapSize() {
        if (typeof map !== 'undefined' && map && typeof map.invalidateSize === 'function') {
            setTimeout(function() { map.invalidateSize(true); }, 100);
            setTimeout(function() { map.invalidateSize(true); }, 400);
            setTimeout(function() { map.invalidateSize(true); }, 900);
        }
    }
    window.fixMapSize = fixMapSize;

    let routeLayer = null;
    let stopMarkers = [];
    let routePoints = [];
    let cumulativeDistances = [];
    let totalRouteDistance = 0;
    let stopDistancesAtRoute = [];  // distance à laquelle on atteint chaque arrêt
    let stopsData = [];
    let simInterval = null;
    let simStartTime = null;
    let simSpeedKmh = 30;
    let simDistanceTraveled = 0;

    function clearRoute() {
        stopRouteSimulation();
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        stopMarkers.forEach(m => map.removeLayer(m));
        stopMarkers = [];
        routePoints = [];
        cumulativeDistances = [];
        totalRouteDistance = 0;
        stopDistancesAtRoute = [];
        stopsData = [];
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function getPositionAtDistance(km) {
        if (!routePoints.length || !cumulativeDistances.length) return null;
        if (km <= 0) return { lat: routePoints[0][0], lng: routePoints[0][1], nextStopIndex: 0 };
        if (km >= totalRouteDistance) {
            const last = routePoints.length - 1;
            return { lat: routePoints[last][0], lng: routePoints[last][1], nextStopIndex: stopsData.length - 1, finished: true };
        }
        let i = 0;
        while (i < cumulativeDistances.length - 1 && cumulativeDistances[i + 1] < km) i++;
        const d0 = cumulativeDistances[i], d1 = cumulativeDistances[i + 1];
        const frac = (km - d0) / (d1 - d0);
        const lat = routePoints[i][0] + frac * (routePoints[i + 1][0] - routePoints[i][0]);
        const lng = routePoints[i][1] + frac * (routePoints[i + 1][1] - routePoints[i][1]);
        let nextStopIdx = 0;
        for (let s = 0; s < stopDistancesAtRoute.length; s++) {
            if (stopDistancesAtRoute[s] > km) { nextStopIdx = s; break; }
            nextStopIdx = s;
        }
        const distToNext = nextStopIdx < stopDistancesAtRoute.length && stopDistancesAtRoute[nextStopIdx] > km
            ? stopDistancesAtRoute[nextStopIdx] - km : 0;
        return { lat, lng, nextStopIndex: nextStopIdx, distanceToNextStop: Math.max(0, distToNext) };
    }

    function getSimulationStatus() {
        if (!simStartTime) return null;
        const elapsedHours = (Date.now() - simStartTime) / 3600000;
        simDistanceTraveled = Math.min(simSpeedKmh * elapsedHours, totalRouteDistance);
        const pos = getPositionAtDistance(simDistanceTraveled);
        if (!pos) return null;
        const distNext = pos.distanceToNextStop != null ? Math.round(pos.distanceToNextStop * 1000) / 1000 : 0;
        const etaMin = pos.distanceToNextStop != null && simSpeedKmh > 0 ? Math.round((pos.distanceToNextStop / simSpeedKmh) * 60) : 0;
        const nextName = stopsData[pos.nextStopIndex] ? stopsData[pos.nextStopIndex].name : "";
        return JSON.stringify({
            speed: simSpeedKmh,
            distanceTraveled: Math.round(simDistanceTraveled * 1000) / 1000,
            distanceToNextStop: distNext,
            nextStopName: nextName,
            etaMinutes: etaMin
        });
    }

    function startRouteSimulation(speedKmh) {
        stopRouteSimulation();
        if (!routePoints.length) return;
        simSpeedKmh = speedKmh || 30;
        simStartTime = Date.now();
        simInterval = setInterval(function() {
            const elapsedHours = (Date.now() - simStartTime) / 3600000;
            simDistanceTraveled = Math.min(simSpeedKmh * elapsedHours, totalRouteDistance);
            const pos = getPositionAtDistance(simDistanceTraveled);
            if (pos) {
                updateBusPosition(pos.lat, pos.lng);
                if (simDistanceTraveled >= totalRouteDistance) stopRouteSimulation();
            }
        }, 500);
    }

    function stopRouteSimulation() {
        if (simInterval) { clearInterval(simInterval); simInterval = null; }
    }

    function isRouteSimulationActive() {
        return simInterval != null;
    }

    function dedupeStops(stops) {
        const out = [];
        let prev = null;
        for (const s of stops) {
            const lat = Number(s.lat), lng = Number(s.lng);
            if (!isFinite(lat) || !isFinite(lng)) continue;
            if (prev && Math.abs(prev.lat - lat) < 0.00005 && Math.abs(prev.lng - lng) < 0.00005) continue;
            out.push({ ...s, lat, lng });
            prev = { lat, lng };
        }
        return out;
    }

    // stops = [{lat, lng, name, order}, ...], onReadyCallback = optional function(speedKmh) to start sim
    async function setRoute(stops, onReadyCallback, speedKmh) {
        clearRoute();
        if (!stops || !stops.length) return;

        stops.sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
        stops = dedupeStops(stops);
        stopsData = stops;
        if (stops.length < 2) return;

        for (const s of stops) {
            const p = [s.lat, s.lng];
            const m = L.circleMarker(p, { radius: 6, weight: 2 }).addTo(map);
            m.bindPopup("<b>" + (s.name || "Arrêt") + "</b>");
            stopMarkers.push(m);
        }

        const coords = stops.map(s => `${s.lng},${s.lat}`).join(";");
        const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            if (!data.routes || !data.routes.length) {
                if (onReadyCallback) onReadyCallback(speedKmh);
                return;
            }

            const geom = data.routes[0].geometry;
            const latlngs = geom.coordinates.map(c => [c[1], c[0]]);
            routePoints = latlngs;

            cumulativeDistances = [0];
            for (let i = 1; i < latlngs.length; i++) {
                const d = haversineKm(latlngs[i-1][0], latlngs[i-1][1], latlngs[i][0], latlngs[i][1]);
                cumulativeDistances.push(cumulativeDistances[i-1] + d);
            }
            totalRouteDistance = cumulativeDistances[cumulativeDistances.length - 1];

            stopDistancesAtRoute = [];
            let lastIdx = 0;
            for (const stop of stops) {
                let bestIdx = lastIdx, bestD = 1e9;
                for (let i = lastIdx; i < latlngs.length; i++) {
                    const d = haversineKm(stop.lat, stop.lng, latlngs[i][0], latlngs[i][1]);
                    if (d < bestD) { bestD = d; bestIdx = i; }
                }
                stopDistancesAtRoute.push(cumulativeDistances[bestIdx]);
                lastIdx = bestIdx;
            }

            routeLayer = L.polyline(latlngs, { weight: 5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

            initBus(latlngs[0][0], latlngs[0][1], 14);
            if (onReadyCallback && typeof onReadyCallback === 'function') {
                onReadyCallback(speedKmh);
            } else if (speedKmh > 0) {
                startRouteSimulation(speedKmh);
            }
        } catch (e) {
            console.log("OSRM error:", e);
            if (onReadyCallback) onReadyCallback(speedKmh);
        }
    }
</script>
</body>
</html>
