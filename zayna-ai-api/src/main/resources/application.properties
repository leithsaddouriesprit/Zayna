spring.application.name=zayna-ai-api
server.port=8081

# Modele IA configurable
ai.model=llama3.2:3b
ai.ollama.url=http://localhost:11434/api/generate
# Reduire hallucinations (temp basse, top_p modere, max_tokens limite)
ai.temperature=0.2
ai.top_p=0.9
ai.max_tokens=512

server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=jdbc:mysql://localhost:3306/zaynaa
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ETA pipeline
eta.enabled=true
eta.strategy=speed
eta.staleSeconds=60