<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tracking</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>


    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    // 1) MAP INIT
    var map = L.map('map').setView([36.8065, 10.1815], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    function initBus(lat, lng, zoom) {
        busMarker.setLatLng([lat, lng]);
        map.setView([lat, lng], zoom || 14);
    }

    // 2) BUS ICON
    var busIcon = L.icon({
        iconUrl: 'bus.png',
        iconSize: [40, 40],
        iconAnchor: [20, 20],
        popupAnchor: [0, -20]
    });

    // 3) BUS MARKER
    var busMarker = L.marker([36.8065, 10.1815], {
        icon: busIcon,
        title: "Bus"
    }).addTo(map);


    function updateBusPosition(lat, lng, angle) {
        busMarker.setLatLng([lat, lng]);

        if (angle !== undefined) {
            busMarker.setRotationAngle(angle);
        }
    }

    function panToBus(lat, lng) { map.panTo([lat, lng]); }

    function fixMapSize() {
        setTimeout(() => map.invalidateSize(true), 100);
        setTimeout(() => map.invalidateSize(true), 400);
        setTimeout(() => map.invalidateSize(true), 900);
    }

    let routeLayer = null;
    let stopMarkers = [];

    function clearRoute() {
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        stopMarkers.forEach(m => map.removeLayer(m));
        stopMarkers = [];
    }

    function dedupeStops(stops) {
        const out = [];
        let prev = null;
        for (const s of stops) {
            const lat = Number(s.lat), lng = Number(s.lng);
            if (!isFinite(lat) || !isFinite(lng)) continue;

            // ignore points quasi identiques (évite les loops OSRM)
            if (prev && Math.abs(prev.lat - lat) < 0.00005 && Math.abs(prev.lng - lng) < 0.00005) {
                continue;
            }
            out.push({ ...s, lat, lng });
            prev = { lat, lng };
        }
        return out;
    }

    // stops = [{lat, lng, name, order}, ...]
    async function setRoute(stops) {
        clearRoute();
        if (!stops || !stops.length) return;

        // tri + nettoyage
        stops.sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
        stops = dedupeStops(stops);
        if (stops.length < 2) return;

        // markers arrêts
        for (const s of stops) {
            const p = [s.lat, s.lng];
            const m = L.circleMarker(p, { radius: 6, weight: 2 }).addTo(map);
            m.bindPopup("<b>" + (s.name || "Arrêt") + "</b>");
            stopMarkers.push(m);
        }

        // OSRM coordinates: lng,lat ; lng,lat ...
        const coords = stops.map(s => `${s.lng},${s.lat}`).join(";");

        // Route réelle
        const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            if (!data.routes || !data.routes.length) return;

            const geom = data.routes[0].geometry; // GeoJSON LineString
            const latlngs = geom.coordinates.map(c => [c[1], c[0]]); // обратно lat,lng

            routeLayer = L.polyline(latlngs, { weight: 5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
        } catch (e) {
            console.log("OSRM error:", e);
        }
    }
</script>
</body>
</html>
